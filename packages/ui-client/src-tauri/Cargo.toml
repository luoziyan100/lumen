[package]
# crate 名(内部);Dock/菜单显示名看 [[bin]] + tauri.conf productName
name = "lumen-ui"
version = "0.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api:窗口透明以透出系统毛玻璃(私有 API,不可上架 App Store)
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
base64 = "0.22"
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }

[target.'cfg(target_os = "macos")'.dependencies]
# 版本沿用 Tauri 已解析的依赖；只桥接它未暴露的原生窗口通知。
objc2 = "=0.6.4"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSNotification", "NSObject", "NSString"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSWindow"] }

[[bin]]
# tauri:dev 直接跑此二进制——macOS Dock 气泡用进程文件名;勿再用 lumen-ui(会显示成 Lumen UI)
name = "Lumen"
path = "src/main.rs"
