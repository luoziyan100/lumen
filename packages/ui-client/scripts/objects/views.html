<html lang="zh-CN"><head><meta charset="utf-8"><title>View objects · Lumen</title>
<style>
body { margin: 0; padding: 24px; background: #f3efe7; font: 13px -apple-system, "PingFang SC", sans-serif; color: #2b2d31; }
body.dark { background: #1d1c1a; color: #e8e4dc; }
.row { display: flex; gap: 24px; align-items: flex-end; flex-wrap: wrap; width: 1100px; }
.cell { width: 320px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.cell .iso-host { width: 320px; }
.name { color: #8a8d95; }
.hide { display: none; }

.iso { display: block; width: 100%; height: auto; overflow: visible; pointer-events: none; }
.iso .f { transform-box: view-box; transform-origin: 0 0; }
.iso * { vector-effect: non-scaling-stroke; }
.iso .ln { stroke: #2f2b25; stroke-width: 1.1; stroke-linejoin: round; stroke-linecap: round; }
.iso .hair { fill: none; stroke: #6d6458; stroke-width: .6; stroke-linecap: round; }
.iso .grain { fill: none; stroke: #b9ad97; stroke-width: .55; stroke-linecap: round; }
.iso .brass { fill: #e3c27e; stroke: #2f2b25; stroke-width: 1; }
.iso .brass-d { fill: #c99f52; stroke: #2f2b25; stroke-width: .8; }
.iso text { font-family: var(--sans, -apple-system, "PingFang SC", sans-serif); fill: #3b362e; }
.iso-host { cursor: pointer; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }


@keyframes bx-spin { 0% { transform: rotate(0deg); } 25% { transform: rotate(90deg); } 50% { transform: rotate(180deg); } 75% { transform: rotate(270deg); } 100% { transform: rotate(360deg); } }
@keyframes bx-jewel { 0%, 100% { opacity: 0.52; } 50% { opacity: 1; } }

.iso-box .bx-key-spin { animation: bx-spin 18s linear infinite; }
.iso-box .bx-jewel-glow { animation: bx-jewel 3.8s ease-in-out infinite; }

.iso-box .bx-key-wind { transform: rotate(0deg); transition: transform 0.9s cubic-bezier(.45, 0, .55, 1); }

/* Closing: the inner face falls first, then the top face swings back down */
.iso-box .bx-lid-back {
  transform: scaleY(0);
  transform-box: view-box;
  transform-origin: 128px 98px;
  transition: transform 0.32s cubic-bezier(.5, 0, .9, .5) 0s;
}
.iso-box .bx-lid-front {
  transform: scaleY(1);
  transform-box: view-box;
  transform-origin: 128px 97px;
  transition: transform 0.36s cubic-bezier(.1, .5, .3, 1) 0.3s;
}
.iso-box .bx-card-1,
.iso-box .bx-card-2,
.iso-box .bx-card-3 {
  opacity: 0;
  transform: translateY(28px);
  transition: transform 0.5s cubic-bezier(.22, 1, .36, 1), opacity 0.3s ease;
}

/* Hover: the lid cracks open on its hinge */
.iso-host:hover .iso-box .bx-lid-front { transform: scaleY(0.82); transition-delay: 0s; }
.iso-host:hover .iso-box .bx-key-wind { transform: rotate(40deg); }
.iso-host:hover .iso-box .bx-card-1 { opacity: 1; transform: translateY(20px); }

/* Open: the top face folds back to the hinge, then the inner face stands up from it */
.iso-host[data-open] .iso-box .bx-key-wind { transform: rotate(180deg); }
.iso-host[data-open] .iso-box .bx-lid-front { transform: scaleY(0); transition: transform 0.32s cubic-bezier(.5, 0, .9, .5) 0s; }
.iso-host[data-open] .iso-box .bx-lid-back { transform: scaleY(1); transition: transform 0.42s cubic-bezier(.1, .6, .3, 1) 0.3s; }
.iso-host[data-open] .iso-box .bx-card-3 { opacity: 1; transform: translateY(0px); transition-delay: 0.5s; }
.iso-host[data-open] .iso-box .bx-card-2 { opacity: 1; transform: translateY(-4px); transition-delay: 0.56s; }
.iso-host[data-open] .iso-box .bx-card-1 { opacity: 1; transform: translateY(-12px); transition-delay: 0.62s; }

@media (prefers-reduced-motion: reduce) {
  .iso-box .bx-key-spin,
  .iso-box .bx-jewel-glow { animation: none; }
  .iso-box .bx-key-wind,
  .iso-box .bx-lid-front,
  .iso-box .bx-lid-back,
  .iso-box .bx-card-1,
  .iso-box .bx-card-2,
  .iso-box .bx-card-3 { transition-duration: 1ms; transition-delay: 0s; }
}

.iso-easel { --iso-tilt: 0; --iso-brush: 0; --iso-wet: 0; transition: --iso-tilt 700ms cubic-bezier(.22, 1, .36, 1), --iso-brush 900ms cubic-bezier(.22, 1, .36, 1); }

<script>
const HOVER = {"press":"--iso-spin:1","cork":"--iso-tilt:1","lamp":"--iso-dip:1","case":"--iso-tilt:1"}
const NEW = Object.keys(HOVER)
document.querySelectorAll('.iso-host').forEach(h => h.addEventListener('click', () => h.toggleAttribute('data-open')))
document.querySelectorAll('.cell').forEach(c => { const svg = c.querySelector('svg'); c.querySelector('.name').textContent += ' · ' + svg.querySelectorAll('path,rect,circle,ellipse,line,polygon,polyline,text').length })
const pin = (svg, spec) => { svg.style.transition = 'none'; for (const kv of spec.split(',').filter(Boolean)) { const [k, v] = kv.split(':'); svg.style.setProperty(k, v) } }
const q = new URLSearchParams(location.search)
if (q.get('only')) document.querySelectorAll('.cell').forEach(c => { if (NEW.includes(c.dataset.id) && c.dataset.id !== q.get('only')) c.classList.add('hide') })
for (const id of NEW) {
  const svg = document.querySelector('#' + id + ' svg')
  if (q.has('hover')) pin(svg, HOVER[id])
  if (q.get('set')) pin(svg, q.get('set'))
  if (q.has('open')) document.querySelector('#' + id).setAttribute('data-open', '')
}
if (q.has('dark')) document.body.classList.add('dark')
</script>
