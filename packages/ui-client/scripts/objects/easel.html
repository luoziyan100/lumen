<style>
body { margin: 0; padding: 24px; background: #f3efe7; font: 13px -apple-system, "PingFang SC", sans-serif; color: #2b2d31; }
body.dark { background: #1d1c1a; color: #e8e4dc; }
.row { display: flex; gap: 32px; align-items: flex-end; }
.cell { width: 320px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.name { color: #8a8d95; }
.bench { margin-top: 18px; display: flex; gap: 6px; flex-wrap: wrap; }
.bench button { font: inherit; border: 1px solid rgba(60,48,30,.16); background: transparent; border-radius: 8px; padding: 3px 10px; cursor: pointer; color: inherit; }

.iso { display: block; width: 100%; height: auto; overflow: visible; pointer-events: none; }
.iso .f { transform-box: view-box; transform-origin: 0 0; }
.iso * { vector-effect: non-scaling-stroke; }
.iso .ln { stroke: #2f2b25; stroke-width: 1.1; stroke-linejoin: round; stroke-linecap: round; }
.iso .hair { fill: none; stroke: #6d6458; stroke-width: .6; stroke-linecap: round; }
.iso .grain { fill: none; stroke: #b9ad97; stroke-width: .55; stroke-linecap: round; }
.iso .brass { fill: #e3c27e; stroke: #2f2b25; stroke-width: 1; }
.iso .brass-d { fill: #c99f52; stroke: #2f2b25; stroke-width: .8; }
.iso text { font-family: var(--sans, -apple-system, "PingFang SC", sans-serif); fill: #3b362e; }
.iso-host { cursor: pointer; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }

@property --iso-lid { syntax: '<number>'; inherits: true; initial-value: 0; }
.iso-box { --iso-lid: 0; transition: --iso-lid 900ms cubic-bezier(.32, .72, 0, 1); }
.iso-host:hover .iso-box { --iso-lid: 38; }
.iso-host[data-open] .iso-box { --iso-lid: 104; }
@media (prefers-reduced-motion: reduce) { .iso-box { transition-duration: 1ms; } }

@property --iso-tilt { syntax: '<number>'; inherits: true; initial-value: 0; }
@property --iso-brush { syntax: '<number>'; inherits: true; initial-value: 0; }
@property --iso-wet { syntax: '<number>'; inherits: true; initial-value: 0; }
.iso-easel { --iso-tilt: 0; --iso-brush: 0; --iso-wet: 0; transition: --iso-tilt 700ms cubic-bezier(.32, .72, 0, 1), --iso-brush 0ms linear 520ms, --iso-wet 500ms ease; }
.iso-host:hover .iso-easel { --iso-tilt: 7; }
.iso-host[data-open] .iso-easel { --iso-tilt: 7; --iso-brush: 100; --iso-wet: 1;
  transition: --iso-tilt 700ms cubic-bezier(.32, .72, 0, 1), --iso-brush 2600ms cubic-bezier(.45, .05, .4, .95), --iso-wet 0ms; }
@media (prefers-reduced-motion: reduce) { .iso-easel, .iso-host[data-open] .iso-easel { transition-duration: 1ms; transition-delay: 0ms; } }

</style></head>

<div class="bench">
  <button data-set="">rest</button><button data-set="--iso-tilt:7">hover</button><button data-open>open (click)</button>
  <button data-set="--iso-tilt:7,--iso-brush:20,--iso-wet:1">mid lift</button><button data-set="--iso-tilt:7,--iso-brush:52,--iso-wet:1">mid stroke</button>
  <button data-dark>dark</button>
</div>
<script>
const hosts = document.querySelectorAll('.iso-host')
hosts.forEach(h => h.addEventListener('click', () => h.toggleAttribute('data-open')))
function pin(spec) {
  const svg = document.querySelector('#easel .iso')
  svg.style.cssText = ''
  if (!spec) return
  svg.style.transition = 'none'
  for (const kv of spec.split(',').filter(Boolean)) { const [k, v] = kv.split(':'); svg.style.setProperty(k, v) }
}
document.querySelectorAll('[data-set]').forEach(b => b.addEventListener('click', () => { document.querySelector('#easel').removeAttribute('data-open'); pin(b.dataset.set) }))
document.querySelector('[data-open]').addEventListener('click', () => { pin(''); document.querySelector('#easel').toggleAttribute('data-open') })
document.querySelector('[data-dark]').addEventListener('click', () => document.body.classList.toggle('dark'))
const q = new URLSearchParams(location.search)
if (q.get('set')) pin(q.get('set'))
if (q.has('open')) document.querySelector('#easel').setAttribute('data-open', '')
if (q.has('dark')) document.body.classList.add('dark')
</script>
